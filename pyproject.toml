[project]
name = "tube-to-knowledge"
version = "0.1.0"
description = "Turn the knowledge flowing through YouTube into a personal archive: share a link to Discord, get a Claude summary on your own private site."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "jinja2>=3.1",
    "discord-py>=2.4",
]

[project.scripts]
t2k = "t2k.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["t2k"]   # 프로젝트 이름(tube-to-knowledge)과 패키지 폴더(t2k)가 다르다

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
