no_users = "No people yet: add one with t2k user add ({path})"
bad_toml = "Cannot read {path}:\n  {error}\nFix that line. For example, [site] may be written twice: edit the existing subdomain line instead of adding a new [site] table."

[token]
no_file = "Token file not found: {path}"
no_token = "DISCORD_BOT_TOKEN not found in {path}"

