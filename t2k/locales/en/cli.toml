# Command line and doctor text (English)


[cli]
description = "t2k command. The data folder is the T2K_HOME environment variable (default ~/t2k-data).\n\nSetup: init · user add · user ready · service install · doctor\nBackground (run by the jobs): pipeline · agent · bot\nManual: summarize · weekly · transcript · site · redeploy · sync-ops · remove · move · discord-check\n"
help_target = "What the command acts on (user add · user ready · service install · video URL · ID · week YYYY-Www for weekly)"
help_user = "summarize · site · remove · move: the person's id (default: the first person)"
help_transcript = "summarize: a caption text file you obtained yourself"
help_id = "user add: the person's id (lowercase letters and digits)"
help_name = "user add: the name shown on the site"
help_channel = "user add: the Discord channel ID"
help_owner = "user add: a Discord user ID allowed to make requests (repeatable)"
help_react = "discord-check: add a 👀 reaction to the latest message with a link"
usage_service = "t2k service install | uninstall | status"
usage_user_add = "t2k user add --id ID --name NAME --channel CHANNEL_ID --owner USER_ID [--owner ...]"
usage_user = "t2k user add ... | user ready ID | user list"
usage_weekly = "t2k weekly [YYYY-Www] [--user ID]  (e.g. 2026-W42; defaults to last week)"
not_video = "Not a YouTube video: {target}"
summary_line = "{category} · {rating}/5 {recommendation} · lasts {lifespan}"
deployed = "Deployed {worker}"
user_open = "open"
user_pending = "pending"
discord_check_failed = "Discord check failed: {error}"
moved = "Moved: {line} → {to}"
removed = "Deleted: {id} {title}"
published = "Published to {url}"
publish_failed = "The summary is saved, but committing or pushing the data folder failed (see the message above). It will be published on the next background run, or run t2k redeploy {id}."
not_open_yet = "The summary is saved. {id}'s site is not open yet, so it appears there after t2k user ready {id}."
check_bot = "Bot: {name} ({id})"
check_recent = "Recent messages: {n}"
check_message = "  {id} {author}: {body!r} links {links}"
check_empty = "  All message bodies are empty: Message Content Intent may be off"
check_react = "Reacted {mark}: {id}"

[config]
no_config = "Config file not found: {path}\nTo create a data folder: t2k init (choose the folder with T2K_HOME)"
