{# 요약의 카테고리 이동과 삭제. 실제 반영은 집 컴퓨터가 한다 (site_ops) #}
{% set others = all_cats | rejectattr("id", "equalto", v.cat.id) | list %}
<section class="manage" data-manage data-vid="{{ v.video_id }}" data-title="{{ v.title }}">
  <div data-state="idle">
    {% if others %}
    <div class="rm-row">
      <label class="sort">{{ t("manage.category") }}
        <select data-move-to>
          {% for c in others %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
        </select>
      </label>
      <button type="button" class="rm-btn" data-act="move">{{ t("manage.move") }}</button>
    </div>
    {% endif %}
    <div class="rm-row"><button type="button" class="rm-btn" data-act="ask">{{ t("manage.delete") }}</button></div>
  </div>
  <div data-state="confirm" hidden>
    <p>{{ t("manage.confirm") }}</p>
    <div class="rm-row"><button type="button" class="rm-btn danger" data-act="remove">{{ t("btn.delete") }}</button><button type="button" class="rm-btn" data-act="cancel">{{ t("btn.cancel") }}</button></div>
  </div>
  <div data-state="pending" hidden>
    <p data-pending-text></p>
    <div class="rm-row"><button type="button" class="rm-btn" data-act="undo">{{ t("btn.cancel") }}</button></div>
  </div>
  <p class="rm-msg" role="status"></p>
</section>
