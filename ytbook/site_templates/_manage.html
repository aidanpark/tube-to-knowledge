{# 요약의 카테고리 이동과 삭제. 실제 반영은 집 컴퓨터가 한다 (site_ops) #}
{% set others = all_cats | rejectattr("id", "equalto", v.cat.id) | list %}
<section class="manage" data-manage data-vid="{{ v.video_id }}" data-title="{{ v.title }}">
  <div data-state="idle">
    {% if others %}
    <div class="rm-row">
      <label class="sort">카테고리
        <select data-move-to>
          {% for c in others %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
        </select>
      </label>
      <button type="button" class="rm-btn" data-act="move">이동</button>
    </div>
    {% endif %}
    <div class="rm-row"><button type="button" class="rm-btn" data-act="ask">이 요약 삭제</button></div>
  </div>
  <div data-state="confirm" hidden>
    <p>이 요약을 삭제할까요? 같은 동영상은 다시 요약하지 않습니다.</p>
    <div class="rm-row"><button type="button" class="rm-btn danger" data-act="remove">삭제</button><button type="button" class="rm-btn" data-act="cancel">취소</button></div>
  </div>
  <div data-state="pending" hidden>
    <p data-pending-text></p>
    <div class="rm-row"><button type="button" class="rm-btn" data-act="undo">취소</button></div>
  </div>
  <p class="rm-msg" role="status"></p>
</section>
