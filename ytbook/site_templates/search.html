{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block body %}
<div class="searchbox">
  <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">요약 검색</label>
  <div class="field">
    {{ icon("search", 20) }}
    <input id="q" type="search" autocomplete="off" placeholder="제목, 태그, 채널, 본문" role="combobox" aria-controls="suggest" aria-expanded="false">
    <button type="button" class="clear" aria-label="검색어 지우기" hidden>{{ icon("close", 18) }}</button>
  </div>
  <div id="suggest" class="suggest" role="listbox" aria-label="검색어 제안" hidden></div>
</div>
<div class="chips scroll" style="padding-top: 16px" role="group" aria-label="필터">
  <button type="button" class="chip" aria-pressed="true" data-type="all">전체</button>
  <button type="button" class="chip" aria-pressed="false" data-type="요약">요약</button>
  <button type="button" class="chip" aria-pressed="false" data-type="주간 요약">주간 요약</button>
  <button type="button" class="chip" aria-pressed="false" data-toggle="top">별점 4 이상</button>
  <button type="button" class="chip" aria-pressed="false" data-toggle="shorts">Shorts</button>
</div>
<div class="chips scroll" style="padding-top: 8px" role="group" aria-label="수명">
  <button type="button" class="chip" aria-pressed="false" data-life="짧음">수명 짧음</button>
  <button type="button" class="chip" aria-pressed="false" data-life="중간">수명 중간</button>
  <button type="button" class="chip" aria-pressed="false" data-life="긺">수명 긺</button>
</div>
<div class="count"><span id="count" aria-live="polite" tabindex="-1">불러오는 중…</span><span id="order">최신순</span></div>
<div class="results" id="results"></div>
<nav class="pager" id="pager" aria-label="쪽 이동" hidden></nav>
{% endblock %}
{% block scripts %}<script src="assets/search.js?v={{ build_id }}"></script>{% endblock %}
