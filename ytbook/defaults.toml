# 기본 설정. 바꾸려면 데이터 폴더의 config.toml 에 같은 표(section)와 키를 쓴다 (config.settings).

[queue]
max_attempts = 3            # 일시 실패(transient)를 이 횟수만큼 겪으면 실패로 기록한다

[summary]
model = "sonnet"            # 요약에 쓰는 Claude 모델 (claude -p --model)
short_max_seconds = 180     # 이 길이 이하는 Shorts 형식으로 요약
languages = ["ko", "en"]    # 수동 자막의 언어 우선순위. 없으면 원어 자동 자막
timeout_seconds = 600

[ytdlp]
# 자막과 동영상 정보는 yt-dlp 로만 확보한다
attempts = 3                     # 일시 오류일 때 시도 횟수
retry_wait_seconds = [30, 120]   # 1회차 실패 후 · 2회차 실패 후 대기
update_check_hours = 6           # GitHub 최신 릴리스 확인의 최소 간격
brew = ""                        # yt-dlp 를 업데이트할 Homebrew 경로. 비어 있으면 PATH 의 brew

[agent]
# 디스코드 지시 응대 (agent.py). 모델을 고정한다: 전역 Claude 설정을 바꿔도 따라가지 않는다
model = "opus"
history = 10   # 답장 사슬에서 함께 넘길 이전 메시지 수 (넘으면 오래된 것부터 뺀다)

[site]
subdomain = ""   # Cloudflare 계정의 workers.dev 하위 도메인. 사이트 주소는 https://<worker>.<subdomain>.workers.dev
